<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decor Haven - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Login</h1>

    <form id="loginForm" onsubmit="event.preventDefault(); loginUser();">
        <label>TRN:<br>
            <input type="text" id="loginTrn" required placeholder="000-000-000">
        </label><br><br>

        <label>Password:<br>
            <input type="password" id="loginPassword" required>
        </label><br><br>

        <button type="submit">Login</button>
        <button type="button" onclick="clearLoginForm()">Cancel</button>
    </form>

    <p>No account? <a href="register.html">Register here</a></p>

    <script src="script.js"></script>
</body>
</html>
